<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;600;700;800&amp;display=swap');
      
      .bg { fill: #050608; }
      
      /* Swiss Architectural Typography */
      .swiss-brand {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 96px;
        letter-spacing: -4px;
        fill: #FFFFFF;
      }
      
      .swiss-accent {
        fill: #A3E635;
      }
      
      .swiss-outline {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 88px;
        letter-spacing: -3px;
        fill: none;
        stroke: #27272A;
        stroke-width: 2;
      }
      
      .swiss-tagline {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.5px;
        fill: #F4F4F5;
      }
      
      .swiss-desc {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 400;
        font-size: 15px;
        fill: #71717A;
        line-height: 1.5;
      }
      
      .mono-label {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      
      .grid-line {
        stroke: #18181B;
        stroke-width: 1.5;
      }
      
      .grid-marker {
        stroke: #3F3F46;
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <rect width="1600" height="500" class="bg" />

  <!-- Strict Swiss Architectural Grid System -->
  <g class="grid-line">
    <!-- Vertical Column Rulers -->
    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="880" y1="0" x2="880" y2="500" />
    <line x1="1240" y1="0" x2="1240" y2="500" />
    <line x1="1520" y1="0" x2="1520" y2="500" />
    
    <!-- Horizontal Baseline Rulers -->
    <line x1="0" y1="70" x2="1600" y2="70" />
    <line x1="0" y1="430" x2="1600" y2="430" />
  </g>

  <!-- Precision Corner Registration Crosshairs (+) -->
  <g class="grid-marker">
    <path d="M 75 70 L 85 70 M 80 65 L 80 75" />
    <path d="M 475 70 L 485 70 M 480 65 L 480 75" />
    <path d="M 875 70 L 885 70 M 880 65 L 880 75" />
    <path d="M 1235 70 L 1245 70 M 1240 65 L 1240 75" />
    <path d="M 1515 70 L 1525 70 M 1520 65 L 1520 75" />
    
    <path d="M 75 430 L 85 430 M 80 425 L 80 435" />
    <path d="M 475 430 L 485 430 M 480 425 L 480 435" />
    <path d="M 875 430 L 885 430 M 880 425 L 880 435" />
    <path d="M 1235 430 L 1245 430 M 1240 425 L 1240 435" />
    <path d="M 1515 430 L 1525 430 M 1520 425 L 1520 435" />
  </g>

  <!-- Top Swiss Meta Specification Bar -->
  <g transform="translate(100, 45)">
    <text x="0" y="0" class="mono-label swiss-accent">01 // SYSTEM SPECIFICATION</text>
    <text x="400" y="0" class="mono-label" fill="#71717A">MODULE: COI EXTRACTION</text>
    <text x="800" y="0" class="mono-label" fill="#71717A">TARGET: ACORD 25</text>
    <text x="1200" y="0" class="mono-label" fill="#FFFFFF">REL. 2026 / MIT LICENSE</text>
  </g>

  <!-- Giant Asymmetric Hero Typography Section -->
  <g transform="translate(100, 185)">
    <!-- Primary Product Name with Electric Lime Accent -->
    <text x="0" y="0" class="swiss-brand">CERTIFI<tspan class="swiss-accent">TRACK</tspan></text>
    
    <!-- Secondary Outlined Concept Moniker -->
    <text x="0" y="85" class="swiss-outline">STRUCTURED_DATA</text>
    
    <!-- Concise One-Line Positioning & Technical Subtitle -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" class="swiss-tagline">Turn COI documents into structured data.</text>
      <text x="0" y="26" class="swiss-desc">Stateless Certificate of Insurance extraction and deterministic policy normalization.</text>
    </g>
  </g>

  <!-- Right Geometric Technical Reticle & Output Visual -->
  <g transform="translate(1260, 120)">
    <!-- Outer Precision Target Rings -->
    <circle cx="120" cy="120" r="110" fill="none" stroke="#18181B" stroke-width="2" />
    <circle cx="120" cy="120" r="85" fill="none" stroke="#27272A" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="120" cy="120" r="55" fill="#A3E635" />
    
    <!-- Reticle Crosshair Lines -->
    <line x1="120" y1="0" x2="120" y2="240" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="120" x2="240" y2="120" stroke="#000000" stroke-width="2" />
    
    <!-- Center Label -->
    <text x="120" y="125" font-family="'JetBrains Mono', monospace" font-size="14px" font-weight="900" fill="#000000" text-anchor="middle">.XLSX</text>

    <!-- Pipeline Stage Badge Boxes -->
    <g transform="translate(-10, 255)">
      <rect x="0" y="0" width="260" height="26" fill="#0D0D12" stroke="#27272A" rx="3" />
      <text x="12" y="17" class="mono-label" font-size="10px" fill="#A3E635">STATUS: DETERMINISTIC_OK</text>
    </g>
  </g>

  <!-- Bottom Metric & Compliance Evidence Bar -->
  <g transform="translate(100, 465)">
    <circle cx="-15" cy="-4" r="3.5" fill="#A3E635" />
    <text x="0" y="0" class="mono-label" fill="#A1A1AA">100% DETERMINISTIC</text>

    <circle cx="385" cy="-4" r="3.5" fill="#A3E635" />
    <text x="400" y="0" class="mono-label" fill="#A1A1AA">ZERO CLOUD RETENTION</text>

    <circle cx="785" cy="-4" r="3.5" fill="#A3E635" />
    <text x="800" y="0" class="mono-label" fill="#A1A1AA">AUDIT-READY EXPORT</text>

    <circle cx="1185" cy="-4" r="3.5" fill="#A3E635" />
    <text x="1200" y="0" class="mono-label swiss-accent">STATUS: PRODUCTION READY ✦</text>
  </g>
</svg>
