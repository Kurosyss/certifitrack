<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380">
  <defs><style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');
      
      .bg { fill: #0B0E14; }
      .bg-panel { fill: #171B21; stroke: #2A303C; stroke-width: 1; rx: 4; }
      .bg-panel-alt { fill: #1A1F26; }
      
      .text-display { fill: #F0EEE8; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 32px; letter-spacing: -1px; }
      .text-title { fill: #D3D6DC; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.5px; text-transform: uppercase; }
      .text-subtitle { fill: #8B949E; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 18px; }
      
      .text-header { fill: #8B949E; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; }
      .text-cell { fill: #D3D6DC; font-family: 'Inter', sans-serif; font-size: 13px; }
      .text-dim { fill: #6E7681; font-family: 'Inter', sans-serif; font-size: 13px; }
      .text-mono { fill: #8B949E; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
      
      .grid-line { stroke: #2A303C; stroke-width: 1; }
      .arrow { stroke: #4F46E5; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #4F46E5; }
      
      .badge-valid-bg { fill: rgba(16, 185, 129, 0.08); stroke: rgba(16, 185, 129, 0.2); stroke-width: 1; rx: 4; }
      .badge-valid-text { fill: #6EE7B7; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; }
      
      .badge-review-bg { fill: rgba(245, 158, 11, 0.08); stroke: rgba(245, 158, 11, 0.2); stroke-width: 1; rx: 4; }
      .badge-review-text { fill: #FCD34D; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; }
      
      .badge-missing-bg { fill: rgba(100, 116, 139, 0.08); stroke: rgba(100, 116, 139, 0.2); stroke-width: 1; rx: 4; }
      .badge-missing-text { fill: #94A3B8; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; }

      .badge-expired-bg { fill: rgba(239, 68, 68, 0.08); stroke: rgba(239, 68, 68, 0.2); stroke-width: 1; rx: 4; }
      .badge-expired-text { fill: #FCA5A5; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; }
      
      .paper-doc { fill: #F0EEE8; stroke: #D3D6DC; stroke-width: 1; rx: 2; }
      .paper-line { stroke: #D3D6DC; stroke-width: 2; stroke-linecap: round; }
      .paper-highlight { stroke: #4F46E5; stroke-width: 2; stroke-linecap: round; }
</style></defs>
  <rect width="1000" height="380" class="bg" />

  <!-- LEFT: CHAOS -->
  <text x="140" y="40" class="text-title" text-anchor="middle">Chaos</text>
  
  <rect x="40" y="60" width="200" height="280" class="bg-panel" />
  <rect x="40" y="60" width="200" height="40" class="bg-panel-alt" style="rx: 4px 4px 0 0;" />
  <text x="60" y="85" class="text-header">Input Directory</text>
  <line x1="40" y1="100" x2="240" y2="100" class="grid-line" />
  
  <text x="60" y="130" class="text-mono">ACORD_25_Atlas...</text>
  <text x="60" y="170" class="text-mono">Renewal_Cedar_...</text>
  <text x="60" y="210" class="text-mono">Northstar_COI.pdf</text>
  <text x="60" y="250" class="text-mono">Sub042_Iron_Wo...</text>
  <text x="60" y="290" class="text-mono">Q3_Compliance_...</text>
  <text x="60" y="320" class="text-header">+ 142 more files...</text>

  <!-- MIDDLE: ARROW -->
  <path d="M 270 200 L 330 200" class="arrow" />
  <polygon points="330,196 338,200 330,204" class="arrow-head" />

  <!-- RIGHT: STRUCTURE -->
  <text x="680" y="40" class="text-title" text-anchor="middle">Structure</text>

  <rect x="360" y="60" width="600" height="280" class="bg-panel" />
  <rect x="360" y="60" width="600" height="40" class="bg-panel-alt" style="rx: 4px 4px 0 0;" />
  
  <text x="380" y="85" class="text-header">Subcontractor</text>
  <text x="540" y="85" class="text-header">GL Exp.</text>
  <text x="640" y="85" class="text-header">WC Exp.</text>
  <text x="740" y="85" class="text-header">Auto Limit</text>
  <text x="870" y="85" class="text-header">Status</text>
  <line x1="360" y1="100" x2="960" y2="100" class="grid-line" />

  <!-- Row 1 -->
  <text x="380" y="130" class="text-cell">Atlas Ridge Construction</text>
  <text x="540" y="130" class="text-cell">2026-10-01</text>
  <text x="640" y="130" class="text-cell">2026-10-01</text>
  <text x="740" y="130" class="text-cell">$1,000,000</text>
  <rect x="870" y="116" width="46" height="20" class="badge-valid-bg" />
  <text x="876" y="130" class="badge-valid-text">Valid</text>
  <line x1="360" y1="145" x2="960" y2="145" class="grid-line" />

  <!-- Row 2 -->
  <rect x="360" y="145" width="600" height="45" class="bg-panel-alt" />
  <text x="380" y="175" class="text-cell">Cedar Point Roofing</text>
  <text x="540" y="175" class="text-cell">2025-01-15</text>
  <text x="640" y="175" class="text-cell">2025-01-15</text>
  <text x="740" y="175" class="text-cell">$500,000</text>
  <rect x="870" y="161" width="58" height="20" class="badge-review-bg" />
  <text x="876" y="175" class="badge-review-text">Review</text>
  <line x1="360" y1="190" x2="960" y2="190" class="grid-line" />

  <!-- Row 3 -->
  <text x="380" y="220" class="text-cell">Northstar Electrical</text>
  <text x="540" y="220" class="text-cell">2026-05-20</text>
  <text x="640" y="220" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="13px">Expired</text>
  <text x="740" y="220" class="text-cell">$2,000,000</text>
  <rect x="870" y="206" width="58" height="20" class="badge-review-bg" />
  <text x="876" y="220" class="badge-review-text">Review</text>
  <line x1="360" y1="235" x2="960" y2="235" class="grid-line" />

  <!-- Row 4 -->
  <rect x="360" y="235" width="600" height="45" class="bg-panel-alt" />
  <text x="380" y="265" class="text-cell">Iron Works Steel</text>
  <text x="540" y="265" class="text-cell">2027-02-28</text>
  <text x="640" y="265" class="text-cell">2027-02-28</text>
  <text x="740" y="265" class="text-dim">Not Included</text>
  <rect x="870" y="251" width="62" height="20" class="badge-missing-bg" />
  <text x="876" y="265" class="badge-missing-text">Missing</text>
  <line x1="360" y1="280" x2="960" y2="280" class="grid-line" />

  <!-- Row 5 -->
  <text x="380" y="310" class="text-cell">Apex HVAC Solutions</text>
  <text x="540" y="310" class="text-cell">2026-11-30</text>
  <text x="640" y="310" class="text-cell">2026-11-30</text>
  <text x="740" y="310" class="text-cell">$1,000,000</text>
  <rect x="870" y="296" width="46" height="20" class="badge-valid-bg" />
  <text x="876" y="310" class="badge-valid-text">Valid</text>

  <!-- Vertical Lines -->
  <line x1="520" y1="60" x2="520" y2="340" class="grid-line" />
  <line x1="620" y1="60" x2="620" y2="340" class="grid-line" />
  <line x1="720" y1="60" x2="720" y2="340" class="grid-line" />
  <line x1="850" y1="60" x2="850" y2="340" class="grid-line" />
</svg>