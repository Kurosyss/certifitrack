<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320">
  <defs><style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');
      
      .bg { fill: #0B0E14; }
      .bg-panel { fill: #171B21; stroke: #2A303C; stroke-width: 1; rx: 4; }
      .bg-panel-alt { fill: #1A1F26; }
      
      .text-display { fill: #F0EEE8; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 32px; letter-spacing: -1px; }
      .text-title { fill: #D3D6DC; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.5px; text-transform: uppercase; }
      .text-subtitle { fill: #8B949E; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 18px; }
      
      .text-header { fill: #8B949E; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; }
      .text-cell { fill: #D3D6DC; font-family: 'Inter', sans-serif; font-size: 13px; }
      .text-dim { fill: #6E7681; font-family: 'Inter', sans-serif; font-size: 13px; }
      .text-mono { fill: #8B949E; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
      
      .grid-line { stroke: #2A303C; stroke-width: 1; }
      .arrow { stroke: #4F46E5; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #4F46E5; }
      
      .badge-valid-bg { fill: rgba(16, 185, 129, 0.08); stroke: rgba(16, 185, 129, 0.2); stroke-width: 1; rx: 4; }
      .badge-valid-text { fill: #6EE7B7; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; }
      
      .badge-review-bg { fill: rgba(245, 158, 11, 0.08); stroke: rgba(245, 158, 11, 0.2); stroke-width: 1; rx: 4; }
      .badge-review-text { fill: #FCD34D; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; }
      
      .badge-missing-bg { fill: rgba(100, 116, 139, 0.08); stroke: rgba(100, 116, 139, 0.2); stroke-width: 1; rx: 4; }
      .badge-missing-text { fill: #94A3B8; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; }

      .badge-expired-bg { fill: rgba(239, 68, 68, 0.08); stroke: rgba(239, 68, 68, 0.2); stroke-width: 1; rx: 4; }
      .badge-expired-text { fill: #FCA5A5; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; }
      
      .paper-doc { fill: #F0EEE8; stroke: #D3D6DC; stroke-width: 1; rx: 2; }
      .paper-line { stroke: #D3D6DC; stroke-width: 2; stroke-linecap: round; }
      .paper-highlight { stroke: #4F46E5; stroke-width: 2; stroke-linecap: round; }
</style></defs>
  <rect width="1000" height="320" class="bg" />
  <rect x="20" y="20" width="960" height="280" class="bg-panel" />
  
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="960" height="40" class="bg-panel-alt" style="rx: 4px 4px 0 0;" />
    <text x="20" y="25" class="text-header">Filename</text>
    <text x="200" y="25" class="text-header">Subcontractor</text>
    <text x="400" y="25" class="text-header">GL Exp.</text>
    <text x="500" y="25" class="text-header">GL Limit</text>
    <text x="600" y="25" class="text-header">WC Exp.</text>
    <text x="700" y="25" class="text-header">Auto Exp.</text>
    <text x="800" y="25" class="text-header">Auto Limit</text>
    <text x="890" y="25" class="text-header">Status</text>
    <line x1="0" y1="40" x2="960" y2="40" class="grid-line" />

    <!-- Row 1 -->
    <text x="20" y="68" class="text-mono text-dim">ACORD_25_Atlas...</text>
    <text x="200" y="68" class="text-cell">Atlas Ridge Construction</text>
    <text x="400" y="68" class="text-cell">2026-10-01</text>
    <text x="500" y="68" class="text-cell">$2,000,000</text>
    <text x="600" y="68" class="text-cell">2026-10-01</text>
    <text x="700" y="68" class="text-cell">2026-10-01</text>
    <text x="800" y="68" class="text-cell">$1,000,000</text>
    <rect x="890" y="54" width="46" height="20" class="badge-valid-bg" />
    <text x="896" y="68" class="badge-valid-text">Valid</text>
    <line x1="0" y1="88" x2="960" y2="88" class="grid-line" />

    <!-- Row 2 -->
    <rect x="0" y="88" width="960" height="48" class="bg-panel-alt" />
    <text x="20" y="116" class="text-mono text-dim">Renewal_Cedar_...</text>
    <text x="200" y="116" class="text-cell">Cedar Point Roofing</text>
    <text x="400" y="116" class="text-cell">2025-01-15</text>
    <text x="500" y="116" class="text-cell">$1,000,000</text>
    <text x="600" y="116" class="text-cell">2025-01-15</text>
    <text x="700" y="116" class="text-dim">Not Included</text>
    <text x="800" y="116" class="text-dim">Missing</text>
    <rect x="890" y="102" width="58" height="20" class="badge-review-bg" />
    <text x="896" y="116" class="badge-review-text">Review</text>
    <line x1="0" y1="136" x2="960" y2="136" class="grid-line" />

    <!-- Row 3 -->
    <text x="20" y="164" class="text-mono text-dim">Northstar_COI.pdf</text>
    <text x="200" y="164" class="text-cell">Northstar Electrical</text>
    <text x="400" y="164" class="text-cell">2026-05-20</text>
    <text x="500" y="164" class="text-cell">$2,000,000</text>
    <text x="600" y="164" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="13px">2024-05-20</text>
    <text x="700" y="164" class="text-cell">2026-05-20</text>
    <text x="800" y="164" class="text-cell">$2,000,000</text>
    <rect x="890" y="150" width="58" height="20" class="badge-review-bg" />
    <text x="896" y="164" class="badge-review-text">Review</text>
    <line x1="0" y1="184" x2="960" y2="184" class="grid-line" />

    <!-- Row 4 -->
    <rect x="0" y="184" width="960" height="48" class="bg-panel-alt" />
    <text x="20" y="212" class="text-mono text-dim">Apex_HVAC_2025.pdf</text>
    <text x="200" y="212" class="text-cell">Apex HVAC Solutions</text>
    <text x="400" y="212" class="text-cell">2026-11-30</text>
    <text x="500" y="212" class="text-cell">$5,000,000</text>
    <text x="600" y="212" class="text-cell">2026-11-30</text>
    <text x="700" y="212" class="text-cell">2026-11-30</text>
    <text x="800" y="212" class="text-cell">$1,000,000</text>
    <rect x="890" y="198" width="46" height="20" class="badge-valid-bg" />
    <text x="896" y="212" class="badge-valid-text">Valid</text>
    <line x1="0" y1="232" x2="960" y2="232" class="grid-line" />
    
    <!-- Row 5 -->
    <text x="20" y="260" class="text-mono text-dim">Sub042_Iron_Wo...</text>
    <text x="200" y="260" class="text-cell">Iron Works Steel</text>
    <text x="400" y="260" class="text-cell">2027-02-28</text>
    <text x="500" y="260" class="text-cell">$10,000,000</text>
    <text x="600" y="260" class="text-cell">2027-02-28</text>
    <text x="700" y="260" class="text-dim">Not Included</text>
    <text x="800" y="260" class="text-dim">Missing</text>
    <rect x="890" y="246" width="62" height="20" class="badge-missing-bg" />
    <text x="896" y="260" class="badge-missing-text">Missing</text>

    <!-- Vertical dividers -->
    <line x1="180" y1="0" x2="180" y2="280" class="grid-line" />
    <line x1="380" y1="0" x2="380" y2="280" class="grid-line" />
    <line x1="480" y1="0" x2="480" y2="280" class="grid-line" />
    <line x1="580" y1="0" x2="580" y2="280" class="grid-line" />
    <line x1="680" y1="0" x2="680" y2="280" class="grid-line" />
    <line x1="780" y1="0" x2="780" y2="280" class="grid-line" />
    <line x1="875" y1="0" x2="875" y2="280" class="grid-line" />
  </g>
</svg>